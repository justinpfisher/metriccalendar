name: Site checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Calendar calculations
        run: node --test tests/calendar.test.cjs
      - name: Verify isolated DC10 research engine
        run: node --test tests/dc10.test.cjs
      - name: Check research preview JavaScript syntax
        run: node --check dc10.js && node --check dc10-preview.js
      - name: Verify selected six-day research calendar
        run: python3 docs/first-principles/v3-six-day-week-2026-10-21/validation/verify.py
      - name: Verify finite-window equinox phase alignment
        run: python3 docs/first-principles/v3-six-day-week-2026-10-21/validation/verify_phase.py
      - name: Rebuild static pages
        run: node scripts/build.mjs
      - name: Check links, metadata, sitemap, and hosting files
        run: node scripts/check.mjs
      - name: Ensure generated pages are committed
        run: git diff --exit-code
