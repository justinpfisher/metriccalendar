<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
<title id="title">Metric Calendar model</title>
<desc id="desc">Ten numbered months, alternating 36 and 37 days, each with six six-day mWeeks. Even months include a bonus rest day.</desc>
<defs>
<style>
  .bg{fill:#fbfaf7}
  .navy{fill:#0b1f3a}
  .muted{fill:#5b6472}
  .line{stroke:#d8dde8;stroke-width:1}
  .card{fill:#fff;stroke:#d8dde8;stroke-width:1.5}
  .focus{fill:#edf2fa;stroke:#cad5e8;stroke-width:.8}
  .rest{fill:#f6f1e7;stroke:#e4d6aa;stroke-width:.8}
  .bonus{fill:#d9a441;stroke:#aa7a19;stroke-width:.8}
  .label{font-family:Inter,Aptos,Arial,sans-serif;font-size:14px;fill:#0b1f3a;font-weight:700}
  .small{font-family:Inter,Aptos,Arial,sans-serif;font-size:11px;fill:#5b6472;font-weight:600}
</style>
</defs>
<rect class="bg" width="1280" height="720" rx="28"/>
<text x="64" y="72" font-family="Inter,Aptos,Arial,sans-serif" font-size="38" font-weight="850" fill="#0b1f3a">Metric Calendar annual model</text>
<text x="64" y="108" font-family="Inter,Aptos,Arial,sans-serif" font-size="18" font-weight="600" fill="#5b6472">10 months · 60 mWeeks · 4 Focus Days + 2 Rest Days · Bonus Rest Days every second month</text>

<g transform="translate(64 140)">
  <rect x="0" y="0" width="18" height="18" rx="4" class="focus"/><text x="28" y="14" class="small">Focus/Work Day</text>
  <rect x="174" y="0" width="18" height="18" rx="4" class="rest"/><text x="202" y="14" class="small">Rest Day</text>
  <rect x="304" y="0" width="18" height="18" rx="4" class="bonus"/><text x="332" y="14" class="small">Bonus Rest Day</text>
</g>

<g transform="translate(64 190)">
  <!-- Month cards generated manually -->
  <g transform="translate(0 0)">
    <rect class="card" width="108" height="206" rx="16"/>
    <text x="18" y="30" class="label">mMonth 01</text><text x="18" y="52" class="small">36 days</text>
    <g transform="translate(18 72)">
      <rect x="0" y="0" width="10" height="10" rx="2" class="focus"/><rect x="14" y="0" width="10" height="10" rx="2" class="focus"/><rect x="28" y="0" width="10" height="10" rx="2" class="focus"/><rect x="42" y="0" width="10" height="10" rx="2" class="focus"/><rect x="56" y="0" width="10" height="10" rx="2" class="rest"/><rect x="70" y="0" width="10" height="10" rx="2" class="rest"/>
      <use href="#week" y="20"/><use href="#week" y="40"/><use href="#week" y="60"/><use href="#week" y="80"/><use href="#week" y="100"/>
    </g>
    <text x="18" y="186" class="small">6 mWeeks</text>
  </g>
  <defs><g id="week">
      <rect x="0" y="0" width="10" height="10" rx="2" class="focus"/><rect x="14" y="0" width="10" height="10" rx="2" class="focus"/><rect x="28" y="0" width="10" height="10" rx="2" class="focus"/><rect x="42" y="0" width="10" height="10" rx="2" class="focus"/><rect x="56" y="0" width="10" height="10" rx="2" class="rest"/><rect x="70" y="0" width="10" height="10" rx="2" class="rest"/>
    </g></defs>
  <g transform="translate(120 0)">
    <rect class="card" width="108" height="206" rx="16"/>
    <text x="18" y="30" class="label">mMonth 02</text><text x="18" y="52" class="small">37 days</text>
    <g transform="translate(18 72)"><use href="#week"/><use href="#week" y="20"/><use href="#week" y="40"/><use href="#week" y="60"/><use href="#week" y="80"/><use href="#week" y="100"/><rect x="35" y="122" width="14" height="14" rx="3" class="bonus"/></g>
    <text x="18" y="186" class="small">+ Bonus Day</text>
  </g>
  <g transform="translate(240 0)">
    <rect class="card" width="108" height="206" rx="16"/>
    <text x="18" y="30" class="label">mMonth 03</text><text x="18" y="52" class="small">36 days</text>
    <g transform="translate(18 72)"><use href="#week"/><use href="#week" y="20"/><use href="#week" y="40"/><use href="#week" y="60"/><use href="#week" y="80"/><use href="#week" y="100"/></g>
    <text x="18" y="186" class="small">6 mWeeks</text>
  </g>
  <g transform="translate(360 0)">
    <rect class="card" width="108" height="206" rx="16"/>
    <text x="18" y="30" class="label">mMonth 04</text><text x="18" y="52" class="small">37 days</text>
    <g transform="translate(18 72)"><use href="#week"/><use href="#week" y="20"/><use href="#week" y="40"/><use href="#week" y="60"/><use href="#week" y="80"/><use href="#week" y="100"/><rect x="35" y="122" width="14" height="14" rx="3" class="bonus"/></g>
    <text x="18" y="186" class="small">+ Bonus Day</text>
  </g>
  <g transform="translate(480 0)">
    <rect class="card" width="108" height="206" rx="16"/>
    <text x="18" y="30" class="label">mMonth 05</text><text x="18" y="52" class="small">36 days</text>
    <g transform="translate(18 72)"><use href="#week"/><use href="#week" y="20"/><use href="#week" y="40"/><use href="#week" y="60"/><use href="#week" y="80"/><use href="#week" y="100"/></g>
    <text x="18" y="186" class="small">6 mWeeks</text>
  </g>
  <g transform="translate(600 0)">
    <rect class="card" width="108" height="206" rx="16"/>
    <text x="18" y="30" class="label">mMonth 06</text><text x="18" y="52" class="small">37 days</text>
    <g transform="translate(18 72)"><use href="#week"/><use href="#week" y="20"/><use href="#week" y="40"/><use href="#week" y="60"/><use href="#week" y="80"/><use href="#week" y="100"/><rect x="35" y="122" width="14" height="14" rx="3" class="bonus"/></g>
    <text x="18" y="186" class="small">+ Bonus Day</text>
  </g>
  <g transform="translate(720 0)">
    <rect class="card" width="108" height="206" rx="16"/>
    <text x="18" y="30" class="label">mMonth 07</text><text x="18" y="52" class="small">36 days</text>
    <g transform="translate(18 72)"><use href="#week"/><use href="#week" y="20"/><use href="#week" y="40"/><use href="#week" y="60"/><use href="#week" y="80"/><use href="#week" y="100"/></g>
    <text x="18" y="186" class="small">6 mWeeks</text>
  </g>
  <g transform="translate(840 0)">
    <rect class="card" width="108" height="206" rx="16"/>
    <text x="18" y="30" class="label">mMonth 08</text><text x="18" y="52" class="small">37 days</text>
    <g transform="translate(18 72)"><use href="#week"/><use href="#week" y="20"/><use href="#week" y="40"/><use href="#week" y="60"/><use href="#week" y="80"/><use href="#week" y="100"/><rect x="35" y="122" width="14" height="14" rx="3" class="bonus"/></g>
    <text x="18" y="186" class="small">+ Bonus Day</text>
  </g>
  <g transform="translate(960 0)">
    <rect class="card" width="108" height="206" rx="16"/>
    <text x="18" y="30" class="label">mMonth 09</text><text x="18" y="52" class="small">36 days</text>
    <g transform="translate(18 72)"><use href="#week"/><use href="#week" y="20"/><use href="#week" y="40"/><use href="#week" y="60"/><use href="#week" y="80"/><use href="#week" y="100"/></g>
    <text x="18" y="186" class="small">6 mWeeks</text>
  </g>
  <g transform="translate(1080 0)">
    <rect class="card" width="108" height="206" rx="16"/>
    <text x="18" y="30" class="label">mMonth 10</text><text x="18" y="52" class="small">37 / 38 leap</text>
    <g transform="translate(18 72)"><use href="#week"/><use href="#week" y="20"/><use href="#week" y="40"/><use href="#week" y="60"/><use href="#week" y="80"/><use href="#week" y="100"/><rect x="26" y="122" width="14" height="14" rx="3" class="bonus"/><rect x="44" y="122" width="14" height="14" rx="3" class="bonus" opacity=".55"/></g>
    <text x="18" y="186" class="small">+ year-end</text>
  </g>
</g>
<g transform="translate(64 470)">
  <rect x="0" y="0" width="1152" height="150" rx="22" fill="#0b1f3a"/>
  <text x="40" y="52" font-family="Inter,Aptos,Arial,sans-serif" font-size="28" font-weight="850" fill="#fff">A standard Metric year contains 240 Focus Days, 120 Rest Days, and 5 Bonus Rest Days.</text>
  <text x="40" y="92" font-family="Inter,Aptos,Arial,sans-serif" font-size="18" font-weight="600" fill="#d8dde8">Leap years add one additional year-end day: mYYYY-10-38.</text>
  <text x="40" y="122" font-family="Inter,Aptos,Arial,sans-serif" font-size="15" font-weight="600" fill="#d9a441">J. Fisher / MetricCalendar.org</text>
</g>
</svg>